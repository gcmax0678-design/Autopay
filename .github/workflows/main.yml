on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - run: yes | sdkmanager --licenses > /dev/null; sdkmanager "platforms;android-34" "build-tools;34.0.0"
      - run: unzip -q *.zip
      - run: |
          cd bkash-autopay/android-app
          wget -q https://services.gradle.org/distributions/gradle-8.7-bin.zip
          unzip -q gradle-8.7-bin.zip
          ./gradle-8.7/bin/gradle wrapper
          ./gradlew assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: autopay-apk
          path: bkash-autopay/android-app/app/build/outputs/apk/debug/app-debug.apk
